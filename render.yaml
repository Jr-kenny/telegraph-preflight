# OneShot live demo — Render blueprint
# Deploy with: render.com dashboard -> New -> Blueprint -> connect this repo.
# The service is a free Node web service. The wallet key is NOT in this
# file: set TELEGRAPH_PRIVATE_KEY in the Render dashboard (Environment tab)
# after the first deploy. Until it is set, the page still loads and shows
# the two verified runs, but POST /api/run returns 503.
services:
  - type: web
    name: oneshot-demo
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TELEGRAPH_PRIVATE_KEY
        sync: false
